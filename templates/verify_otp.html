```html
<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Xác thực OTP - BWF LiveScore</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(225,29,72,.2),
                    transparent 40%
                ),
                #090d16;

        }


        .card {

            width: 100%;

            max-width: 400px;

            padding: 35px;

            text-align: center;

            background: #121826;

            color: white;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.5);

        }


        .icon {

            font-size: 50px;

            margin-bottom: 15px;

        }


        h1 {

            font-size: 23px;

            margin-bottom: 10px;

        }


        p {

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 20px;

        }


        input {

            width: 100%;

            padding: 15px;

            text-align: center;

            letter-spacing: 8px;

            font-size: 24px;

            font-weight: 900;

            border-radius: 10px;

            border:
                1px solid #334155;

            background: #0f172a;

            color: white;

            outline: none;

        }


        input:focus {

            border-color: #e11d48;

        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #e11d48,
                    #be123c
                );

            color: white;

            font-weight: 900;

            cursor: pointer;

        }


        .error {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 8px;

            background:
                rgba(220,38,38,.15);

            border:
                1px solid
                rgba(220,38,38,.3);

            color: #f87171;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="card">


    <div class="icon">
        📩
    </div>


    <h1>
        Xác thực OTP
    </h1>


    <p>

        Chúng tôi đã gửi mã OTP
        đến thông tin bạn vừa đăng ký.

        <br>

        Vui lòng nhập mã gồm
        <strong>6 chữ số</strong>.

    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">


        <input
            type="text"
            name="otp"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            placeholder="000000"
            required
            autofocus>


        <button
            type="submit">

            ✓ XÁC NHẬN OTP

        </button>


    </form>


</div>


</body>

</html>
```
