<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - BWF LiveScore</title>


    <style>
        :root {
            --bwf-red: #e11d48;
            --bwf-red-dark: #be123c;
            --bwf-red-glow: rgba(225, 29, 72, 0.35);
    
            --bg-dark: #090d16;
            --card-bg: rgba(18, 24, 38, 0.94);
            --border-card: rgba(255, 255, 255, 0.08);
    
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
    
            --input-bg: rgba(10, 14, 23, 0.85);
    
            --radius: 16px;
        }
    
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
    
        body {
            font-family: 'Inter', Arial, sans-serif;
    
            min-height: 100vh;
    
            display: flex;
            justify-content: center;
            align-items: center;
    
            padding: 25px;
    
            color: var(--text-light);
    
            background-color: var(--bg-dark);
    
            background-image:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(225, 29, 72, 0.20) 0%,
                    transparent 40%
                ),
    
                radial-gradient(
                    circle at 90% 90%,
                    rgba(190, 18, 60, 0.18) 0%,
                    transparent 45%
                ),
    
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.02) 25%,
                    transparent 25%
                ),
    
                linear-gradient(
                    225deg,
                    rgba(255,255,255,0.02) 25%,
                    transparent 25%
                );
    
            background-size:
                100% 100%,
                100% 100%,
                50px 50px,
                50px 50px;
    
            overflow-x: hidden;
        }
    
    
        /* =========================================
           AUTH CARD
        ========================================= */
    
        .auth-card {
            width: 100%;
            max-width: 440px;
    
            background: var(--card-bg);
    
            border: 1px solid var(--border-card);
    
            border-radius: var(--radius);
    
            padding: 34px;
    
            box-shadow:
                0 25px 60px rgba(0,0,0,0.55),
                0 0 35px rgba(225,29,72,0.08);
    
            backdrop-filter: blur(18px);
    
            position: relative;
    
            overflow: hidden;
        }
    
    
        /* ĐƯỜNG ĐỎ TRÊN ĐẦU CARD */
    
        .auth-card::before {
            content: "";
    
            position: absolute;
    
            top: 0;
            left: 0;
            right: 0;
    
            height: 4px;
    
            background:
                linear-gradient(
                    90deg,
                    var(--bwf-red-dark),
                    var(--bwf-red),
                    #fb7185
                );
    
            box-shadow:
                0 0 18px var(--bwf-red-glow);
        }
    
    
        /* =========================================
           LOGO
        ========================================= */
    
        .logo {
            text-align: center;
    
            margin-bottom: 28px;
        }
    
        .logo-icon {
            font-size: 52px;
    
            margin-bottom: 5px;
    
            filter:
                drop-shadow(
                    0 0 12px
                    rgba(225,29,72,0.45)
                );
        }
    
        .logo h1 {
            margin-top: 8px;
    
            font-size: 26px;
    
            font-weight: 900;
    
            letter-spacing: 1px;
    
            text-transform: uppercase;
    
            color: #fff;
        }
    
        .logo p {
            margin-top: 7px;
    
            font-size: 12px;
    
            font-weight: 700;
    
            letter-spacing: 0.8px;
    
            text-transform: uppercase;
    
            color: var(--bwf-red);
        }
    
    
        /* =========================================
           TABS
        ========================================= */
    
        .tabs {
            display: flex;
    
            margin-bottom: 25px;
    
            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }
    
        .tab-btn {
            flex: 1;
    
            padding: 13px 10px;
    
            border: none;
    
            background: transparent;
    
            cursor: pointer;
    
            font-size: 14px;
    
            font-weight: 800;
    
            color: var(--text-muted);
    
            transition:
                color 0.2s,
                background 0.2s;
        }
    
        .tab-btn:hover {
            color: #fff;
        }
    
        .tab-btn.active {
            color: #fff;
    
            border-bottom:
                3px solid
                var(--bwf-red);
    
            margin-bottom: -1px;
    
            text-shadow:
                0 0 10px
                rgba(225,29,72,0.4);
        }
    
    
        /* =========================================
           FORM
        ========================================= */
    
        .form-group {
            margin-bottom: 17px;
        }
    
        label {
            display: block;
    
            margin-bottom: 8px;
    
            font-size: 13px;
    
            font-weight: 800;
    
            color: #cbd5e1;
        }
    
        input {
            width: 100%;
    
            padding: 13px 14px;
    
            border:
                1px solid
                rgba(255,255,255,0.10);
    
            border-radius: 10px;
    
            background:
                var(--input-bg);
    
            color: #fff;
    
            font-size: 14px;
    
            outline: none;
    
            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }
    
        input::placeholder {
            color: #64748b;
        }
    
        input:focus {
            background:
                rgba(10,14,23,0.95);
    
            border-color:
                var(--bwf-red);
    
            box-shadow:
                0 0 0 3px
                rgba(225,29,72,0.12),
    
                0 0 15px
                rgba(225,29,72,0.10);
        }
    
    
        /* =========================================
           SUBMIT BUTTON
        ========================================= */
    
        .btn-submit {
            width: 100%;
    
            padding: 13px;
    
            border: none;
    
            border-radius: 10px;
    
            background:
                linear-gradient(
                    135deg,
                    var(--bwf-red),
                    var(--bwf-red-dark)
                );
    
            color: #fff;
    
            font-size: 14px;
    
            font-weight: 900;
    
            letter-spacing: 0.3px;
    
            cursor: pointer;
    
            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }
    
        .btn-submit:hover {
            transform:
                translateY(-2px);
    
            box-shadow:
                0 8px 22px
                var(--bwf-red-glow);
        }
    
        .btn-submit:active {
            transform:
                translateY(0);
        }
    
    
        /* =========================================
           DIVIDER
        ========================================= */
    
        .divider {
            display: flex;
    
            align-items: center;
    
            gap: 12px;
    
            margin: 23px 0;
    
            color: #64748b;
    
            font-size: 11px;
    
            font-weight: 700;
    
            text-transform: uppercase;
    
            letter-spacing: 0.5px;
        }
    
        .divider::before,
        .divider::after {
            content: "";
    
            flex: 1;
    
            height: 1px;
    
            background:
                rgba(255,255,255,0.08);
        }
    
    
        /* =========================================
           SOCIAL BUTTON
        ========================================= */
    
        .social-btn {
            width: 100%;
    
            padding: 12px;
    
            border-radius: 10px;
    
            margin-bottom: 10px;
    
            display: flex;
    
            align-items: center;
    
            justify-content: center;
    
            gap: 10px;
    
            text-decoration: none;
    
            font-size: 13px;
    
            font-weight: 800;
    
            cursor: pointer;
    
            transition:
                transform 0.2s,
                border-color 0.2s,
                background 0.2s;
        }
    
        .social-btn:hover {
            transform:
                translateY(-2px);
        }
    
    
        /* GOOGLE */
    
        .google {
            background:
                rgba(255,255,255,0.04);
    
            color: #f1f5f9;
    
            border:
                1px solid
                rgba(255,255,255,0.12);
        }
    
        .google:hover {
            background:
                rgba(255,255,255,0.07);
    
            border-color:
                rgba(255,255,255,0.22);
        }
    
    
        /* FACEBOOK */
    
        .facebook {
            background:
                rgba(24,119,242,0.12);
    
            color: #60a5fa;
    
            border:
                1px solid
                rgba(96,165,250,0.25);
        }
    
        .facebook:hover {
            background:
                rgba(24,119,242,0.20);
    
            border-color:
                rgba(96,165,250,0.45);
        }
    
    
        /* =========================================
           ALERT
        ========================================= */
    
        .alert {
            padding: 12px 14px;
    
            border-radius: 10px;
    
            margin-bottom: 17px;
    
            text-align: center;
    
            font-size: 12px;
    
            font-weight: 700;
    
            border: 1px solid;
        }
    
        .alert-error {
            background:
                rgba(225,29,72,0.12);
    
            color: #fb7185;
    
            border-color:
                rgba(225,29,72,0.30);
        }
    
        .alert-success {
            background:
                rgba(34,197,94,0.10);
    
            color: #4ade80;
    
            border-color:
                rgba(34,197,94,0.25);
        }
    
    
        /* =========================================
           BACK HOME
        ========================================= */
    
        .back-home {
            display: block;
    
            text-align: center;
    
            margin-top: 22px;
    
            padding-top: 18px;
    
            border-top:
                1px solid
                rgba(255,255,255,0.06);
    
            color: #64748b;
    
            text-decoration: none;
    
            font-size: 12px;
    
            font-weight: 700;
    
            transition:
                color 0.2s;
        }
    
        .back-home:hover {
            color: #fb7185;
        }
    
    
        /* =========================================
           REGISTER NOTE
        ========================================= */
    
        .register-note {
            margin-top: 15px;
    
            text-align: center;
    
            font-size: 11px;
    
            line-height: 1.6;
    
            color: #64748b;
        }
    
    
        /* =========================================
           MOBILE
        ========================================= */
    
        @media (max-width: 480px) {
    
            body {
                padding: 15px;
            }
    
            .auth-card {
                padding: 26px 20px;
            }
    
            .logo h1 {
                font-size: 22px;
            }
    
            .logo-icon {
                font-size: 45px;
            }
    
            .tab-btn {
                font-size: 13px;
            }
        }
    </style>
    
    
</head>

<body>

<div class="auth-card">

    <!-- LOGO -->
    <div class="logo">

        <div class="logo-icon">
            🏸
        </div>

        <h1>BWF LiveScore</h1>

        <p>Đăng nhập tài khoản thành viên</p>

    </div>


    <!-- TAB -->
    <div class="tabs">

        <button
            class="tab-btn active"
            onclick="switchTab('login')"
            type="button"
        >
            Đăng nhập
        </button>

        <button
            class="tab-btn"
            onclick="switchTab('register')"
            type="button"
        >
            Tạo tài khoản
        </button>

    </div>


    <!-- THÔNG BÁO -->

    {% if error %}

    <div class="alert alert-error">
        {{ error }}
    </div>

    {% endif %}


    {% if success %}

    <div class="alert alert-success">
        {{ success }}
    </div>

    {% endif %}


    <!-- =============================== -->
    <!-- LOGIN -->
    <!-- =============================== -->

    <form
        id="loginForm"
        method="POST"
    >

        <input
            type="hidden"
            name="action"
            value="login"
        >


        <div class="form-group">

            <label>
                Tên đăng nhập
            </label>

            <input
                type="text"
                name="login_value"
                placeholder="Nhập Gmail hoặc số điện thoại"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Mật khẩu
            </label>

            <input
                type="password"
                name="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn-submit"
        >
            🔐 Đăng nhập
        </button>


        <div class="divider">
            Hoặc đăng nhập bằng
        </div>


        <!-- GOOGLE -->

        <a
            href="{{ url_for('google_login') }}"
            class="social-btn google"
        >

            <span style="font-size:18px;">
                G
            </span>

            Đăng nhập bằng Google

        </a>


        <!-- FACEBOOK -->

        <a
            href="{{ url_for('facebook_login') }}"
            class="social-btn facebook"
        >

            <span style="font-size:18px;">
                f
            </span>

            Đăng nhập bằng Facebook

        </a>

    </form>


    <!-- =============================== -->
    <!-- REGISTER -->
    <!-- =============================== -->

    <form
        id="registerForm"
        method="POST"
        style="display:none;"
    >

        <input
            type="hidden"
            name="action"
            value="send_otp"
        >


        <div class="form-group">

            <label>
                Họ và tên
            </label>

            <input
                type="text"
                name="name"
                placeholder="Nguyễn Văn A"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Gmail hoặc số điện thoại
            </label>

            <input
                type="text"
                name="contact"
                placeholder="example@gmail.com hoặc 09xxxxxxxx"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Mật khẩu
            </label>

            <input
                type="password"
                name="password"
                placeholder="Ít nhất 6 ký tự"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="btn-submit"
        >
            📩 Gửi mã OTP
        </button>


        <div class="register-note">

            Sau khi nhập thông tin,
            hệ thống sẽ gửi mã OTP để xác thực.

        </div>

    </form>


    <!-- VỀ TRANG CHỦ -->

    <a
        href="{{ url_for('home') }}"
        class="back-home"
    >
        ← Về trang chủ
    </a>

</div>


<script>

function switchTab(mode) {

    const buttons =
        document.querySelectorAll(".tab-btn");

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");


    if (mode === "login") {

        buttons[0].classList.add("active");

        buttons[1].classList.remove("active");

        loginForm.style.display = "block";

        registerForm.style.display = "none";

    } else {

        buttons[1].classList.add("active");

        buttons[0].classList.remove("active");

        loginForm.style.display = "none";

        registerForm.style.display = "block";

    }

}

</script>

</body>
</html>
