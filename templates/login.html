<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Thành Viên</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #cbd5e1;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: none;
            font-weight: 700;
            cursor: pointer;
            color: #64748b;
        }
        .tab-btn.active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
            margin-bottom: -2px;
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: #2563eb; }
        .btn-submit {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }
        .divider {
            text-align: center;
            margin: 18px 0;
            position: relative;
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .divider::before {
            content: "";
            position: absolute;
            left: 0; top: 50%;
            width: 100%; height: 1px;
            background: #e2e8f0;
            z-index: 1;
        }
        .divider span {
            background: #fff;
            padding: 0 10px;
            position: relative;
            z-index: 2;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
        }
        .btn-google { color: #000; background: #fff; }
        .btn-fb { color: #fff; background: #1877f2; border: none; }
        .alert {
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 14px;
            text-align: center;
        }
        .alert-error { background: #fee2e2; color: #dc2626; }
        .alert-success { background: #dcfce7; color: #16a34a; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Đăng Nhập</button>
        <button class="tab-btn" onclick="switchTab('register')">Tạo Tài Khoản</button>
    </div>

    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <!-- FORM ĐĂNG NHẬP -->
    <form id="loginForm" method="POST">
        <input type="hidden" name="action" value="login">
        <div class="form-group">
            <label>Địa chỉ Email:</label>
            <input type="email" name="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Đăng Nhập</button>

        <div class="divider"><span>Hoặc đăng nhập nhanh bằng</span></div>

<a href="{{ url_for('social_auth', provider='google') }}" class="social-btn btn-google">
    <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>Tiếp tục với Google</span>
</a>

<a href="{{ url_for('social_auth', provider='facebook') }}" class="social-btn btn-fb">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
    </svg>
    <span>Tiếp tục với Facebook</span>
</a>
        </a>
    </form>

    <!-- FORM ĐĂNG KÝ MỚI -->
    <form id="registerForm" method="POST" style="display: none;">
        <input type="hidden" name="action" value="register">
        <div class="form-group">
            <label>Họ và Tên:</label>
            <input type="text" name="name" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="form-group">
            <label>Địa chỉ Email:</label>
            <input type="email" name="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" placeholder="Tạo mật khẩu" required>
        </div>
        <button type="submit" class="btn-submit" style="background:#16a34a;">Đăng Ký Tài Khoản</button>
    </form>

    <div style="text-align: center; margin-top: 18px;">
        <a href="{{ url_for('home') }}" style="color: #64748b; font-size: 0.85rem; text-decoration: none;">← Về Trang Chủ</a>
    </div>
</div>

<script>
    function switchTab(mode) {
        const btns = document.querySelectorAll('.tab-btn');
        if (mode === 'login') {
            btns[0].classList.add('active');
            btns[1].classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        } else {
            btns[1].classList.add('active');
            btns[0].classList.remove('active');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
    }
</script>

</body>
</html>
