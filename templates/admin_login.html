<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - BTC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 360px;
            padding: 30px;
            border-radius: 12px;
        }
        h2 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; color: #0f172a; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        button {
            width: 100%; padding: 10px; background: #0f172a; color: #fff; border: none;
            border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px;
        }
        .alert { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔒 Quản Trị Giải Đấu</h2>
    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Tài khoản Quản trị:</label>
            <input type="text" name="username" placeholder="admin" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit">Đăng Nhập Admin</button>
    </form>
    <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('home') }}" style="color: #64748b; font-size: 0.85rem; text-decoration: none;">← Về Trang Chủ</a>
    </div>
</div>

</body>
</html>
